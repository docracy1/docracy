name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

  # Only runs after `test` passes, and only on main (push or manual Run workflow). Never for
  # pull_request (forks wouldn't have the secret anyway). Requires a CLOUDFLARE_API_TOKEN repo
  # secret (Settings → Secrets and variables → Actions) with Workers Scripts:Edit + Cloudflare
  # Pages:Edit + Account D1:Edit permissions (D1:Edit is required for the migration step).
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply D1 migrations
        # Weekly template/blog queues (0026/0027) must exist for the Monday cron. Safe to re-run.
        # Needs D1:Edit on CLOUDFLARE_API_TOKEN — if missing (7403), deploy continues; apply manually.
        continue-on-error: true
        run: |
          if npx wrangler d1 migrations apply docracy-index --remote; then
            echo "D1 migrations applied"
          else
            echo "::warning::D1 migrations failed — add D1:Edit to CLOUDFLARE_API_TOKEN, or run manually: npx wrangler d1 migrations apply docracy-index --remote (from apps/worker)"
          fi
        working-directory: apps/worker
      - name: Deploy worker
        run: npx wrangler deploy
        working-directory: apps/worker
      - name: Deploy connector
        run: npx wrangler deploy
        working-directory: apps/connector
      - name: Build web
        run: npm run build
        working-directory: apps/web
      - name: Deploy web (Cloudflare Pages)
        # Must pass --branch main so this aliases production (docracy.io). Without it,
        # wrangler only creates a preview deployment (*.docracy.pages.dev) and the custom
        # domain stays on the last --branch main deploy.
        run: npx wrangler pages deploy dist --project-name=docracy --branch main
        working-directory: apps/web
      - name: Submit sitemap to IndexNow (Bing, Yandex, etc.)
        # Best-effort — a transient IndexNow outage shouldn't fail an otherwise-successful deploy.
        run: npm run submit:indexnow || true
        working-directory: apps/web
      - name: Run Monday weekly content (catch-up)
        # Same jobs as the 08:22 UTC cron — use after migrations land or when Monday cron missed.
        # Requires AUTOMATION_API_TOKEN repo secret (same value as wrangler secret on the worker).
        env:
          AUTOMATION_API_TOKEN: ${{ secrets.AUTOMATION_API_TOKEN }}
        run: |
          if [ -z "$AUTOMATION_API_TOKEN" ]; then
            echo "AUTOMATION_API_TOKEN not set — skipping weekly content catch-up"
            exit 0
          fi
          DOW=$(date -u +%u)
          if [ "$DOW" != "1" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Not Monday UTC — skipping weekly content catch-up"
            exit 0
          fi
          curl -sf -X POST "https://api.docracy.io/api/automation/run-weekly-content" \
            -H "Authorization: Bearer $AUTOMATION_API_TOKEN" \
            -H "Content-Type: application/json"
          echo "Weekly content job started (blog + up to 10 templates)"
