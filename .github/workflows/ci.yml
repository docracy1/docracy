name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

  # Only runs after `test` passes, and only on main (push or manual Run workflow). Never for
  # pull_request (forks wouldn't have the secret anyway). Requires a CLOUDFLARE_API_TOKEN repo
  # secret (Settings → Secrets and variables → Actions) with Workers Scripts:Edit + Cloudflare
  # Pages:Edit permissions.
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # D1 migrations are NOT applied here: CLOUDFLARE_API_TOKEN needs Account → D1:Edit
      # (Workers Scripts:Edit alone returns 7403). Until the token includes D1, apply pending
      # migrations locally: `npx wrangler d1 migrations apply docracy-index --remote`
      # (from apps/worker). Then re-add this step.
      - name: Deploy worker
        run: npx wrangler deploy
        working-directory: apps/worker
      - name: Deploy connector
        run: npx wrangler deploy
        working-directory: apps/connector
      - name: Build web
        run: npm run build
        working-directory: apps/web
      - name: Deploy web (Cloudflare Pages)
        # Must pass --branch main so this aliases production (docracy.io). Without it,
        # wrangler only creates a preview deployment (*.docracy.pages.dev) and the custom
        # domain stays on the last --branch main deploy.
        run: npx wrangler pages deploy dist --project-name=docracy --branch main
        working-directory: apps/web
      - name: Submit sitemap to IndexNow (Bing, Yandex, etc.)
        # Best-effort — a transient IndexNow outage shouldn't fail an otherwise-successful deploy.
        run: npm run submit:indexnow || true
        working-directory: apps/web
