name = "docracy-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Daily reminder sweep, plus a 5-minute cron so the onboarding email drip and the preparer
# completion-nudge sweep (index.ts branches on event.cron to run only those on this entry) have
# minute-scale granularity. Cron syntax is UTC.
[triggers]
crons = ["0 8 * * *", "*/5 * * * *"]

[[kv_namespaces]]
binding = "DOCRACY_KV"
id = "981eb8f0eace4d29bedb6b664a546c74"
preview_id = "704f39e4556644cf91ca4f49b551fab1"

[[r2_buckets]]
binding = "DOCRACY_DOCS"
bucket_name = "docracy-docs"

# Create with: wrangler d1 create docracy-index, then run migrations:
# wrangler d1 migrations apply docracy-index --remote (and --local for dev)
[[d1_databases]]
binding = "DOCRACY_DB"
database_name = "docracy-index"
database_id = "498b3b25-111e-435e-baca-5fb4af9c0e38"

# Free (10k neurons/day, resets daily) — no account or API key needed. Used for AI-first support
# triage in lib/support.ts.
[ai]
binding = "AI"

# Bot-aware funnel tracking (lib/analytics.ts) — write-only from the Worker; the dataset
# materializes on first write, no separate provisioning step. Reading the data back requires the
# separate Analytics Engine SQL HTTP API with a scoped API token (Account Analytics:Read) — not
# accessible via this binding.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "docracy_funnel"

# --- Non-secret config ---
# This is the deployed (production) value. Local `wrangler dev` overrides it back to localhost
# via apps/worker/.dev.vars, which takes precedence over [vars] when running locally.
[vars]
PUBLIC_APP_URL = "https://docracy.io"
PUBLIC_CONNECTOR_URL = "https://mcp.docracy.io"
PUBLIC_WORKER_URL = "https://api.docracy.io"
FREE_TIER_MAX_SIGNERS = "2"
DOC_TTL_DAYS = "9"
FEEDBACK_EMAIL = "founder@docracy.io"
# Comma-separated allow-list for GET /api/admin/analytics — everyone else gets a 401, including
# paid customers. Not a secret (just email addresses), but keep it to founders/admins only.
ADMIN_EMAILS = "rl@relacon.at"
# Not secret (just an identifier) — needed only for the Analytics Engine SQL read API.
CF_ACCOUNT_ID = "d7764515fd9887154193dc04810d81d8"
# Reference only (see packages/shared/src/types.ts) — not read at runtime.
STRIPE_ENTERPRISE_PRODUCT_ID = "prod_UwhdVD23t6zce3"
# The actual Price used to create Enterprise checkout sessions (POST /api/billing/checkout
# {plan: "enterprise"}) — a real recurring annual subscription, same self-serve flow as the
# standard plan. Not secret (just an identifier).
STRIPE_ENTERPRISE_PRICE_ID = "price_1TwoDtQvixTOu6qpwfZgfEO5"
# Cloud-storage connectors (Enterprise only, see lib/cloudConnectors.ts) — client IDs are public,
# not secret. Each provider's routes 501 gracefully until both its ID and secret are set. Register
# the OAuth app in that provider's own developer console with redirect URI
# {PUBLIC_WORKER_URL}/api/account/connectors/{provider}/callback, then fill these in:
# DROPBOX_CLIENT_ID = "..."
# MS_CLIENT_ID = "..."
# BOX_CLIENT_ID = "..."

# --- Secrets (never stored in this file) ---
# Set with: wrangler secret put TOKEN_SECRET
# Set with: wrangler secret put RESEND_API_KEY   (optional locally — omit to log emails to console instead of sending)
# Set with: wrangler secret put CF_ANALYTICS_API_TOKEN   (optional — a Cloudflare API token scoped
#   to Account Analytics:Read; GET /api/admin/analytics returns a "not configured" response until
#   this is set, rather than failing)
#
# --- Billing (Stripe) — all optional; billing routes 501 gracefully until these are set ---
# Set with: wrangler secret put STRIPE_SECRET_KEY
# Set with: wrangler secret put STRIPE_WEBHOOK_SECRET   (from the Stripe Dashboard's webhook config)
# STRIPE_PRICE_ID is not secret (just an identifier) — once a Price exists in the Stripe
# Dashboard, add it to [vars] above as STRIPE_PRICE_ID = "price_xxxxx".
#
# --- Cloud connectors (Dropbox/OneDrive/Box) — all optional; each 501s until configured ---
# Set with: wrangler secret put DROPBOX_CLIENT_SECRET
# Set with: wrangler secret put MS_CLIENT_SECRET
# Set with: wrangler secret put BOX_CLIENT_SECRET

# --- Staging: isolated KV/D1/R2 so testing never touches production data ---
# Deploy with: wrangler deploy --env staging
# Secrets: wrangler secret put TOKEN_SECRET --env staging (RESEND_API_KEY intentionally left
# unset here — emails just log to the console instead of actually sending during testing)
[env.staging]
name = "docracy-worker-staging"

[env.staging.triggers]
crons = ["0 8 * * *", "*/5 * * * *"]

[[env.staging.kv_namespaces]]
binding = "DOCRACY_KV"
id = "d2478fb8d7624291b832b5a8249dfa3c"

[[env.staging.r2_buckets]]
binding = "DOCRACY_DOCS"
bucket_name = "docracy-docs-staging"

[[env.staging.d1_databases]]
binding = "DOCRACY_DB"
database_name = "docracy-index-staging"
database_id = "2e0a9181-6bd6-4e79-9646-cdca7d1d8aba"

[env.staging.ai]
binding = "AI"

[[env.staging.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "docracy_funnel_staging"

[env.staging.vars]
# The worker itself has no frontend routes — this must point to wherever the web app that
# renders /sign/:token actually lives. No staging Pages site exists yet, so this points at the
# local web dev server for now (matches how .dev.vars overrides this for local `wrangler dev`).
# Update this (and redeploy) once/if a staging Pages deployment exists.
PUBLIC_APP_URL = "http://localhost:5173"
PUBLIC_CONNECTOR_URL = "https://docracy-connector-staging.rl-d77.workers.dev"
PUBLIC_WORKER_URL = "https://docracy-worker-staging.rl-d77.workers.dev"
FREE_TIER_MAX_SIGNERS = "2"
DOC_TTL_DAYS = "9"
FEEDBACK_EMAIL = "founder@docracy.io"
ADMIN_EMAILS = "rl@relacon.at"
